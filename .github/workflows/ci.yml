name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Heavy tests (TASK-SPEC F-09: "heavy/scale tests — by tag and
  # schedule"): full-domain pair-map brute force (2^32 sweep) runs here,
  # not in the default pass, so CI's `go test -cover` stays fast and green.
  schedule:
    - cron: '30 3 * * 1' # Mondays 03:30 UTC

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: English-only guard (no Cyrillic in git content)
        run: bash scripts/check-english.sh

      - name: vet
        run: go vet ./...

      - name: vet gp6lab tag (data-path + integration tests must not rot)
        run: go vet -tags gp6lab ./...

      - name: build (static)
        # TASK-SPEC §9: static linux-amd64 artifact. CGO_ENABLED=0 so the
        # binary runs on clean hosts without local toolchain dependencies.
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags "-s -w" -o bin/gpstream-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/gpstream

      - name: test + coverage
        run: |
          go test -cover -coverprofile=coverage.out ./...
          # gate: core packages must be >= 70% (CR-8); reported below
          go tool cover -func=coverage.out | tail -1

      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.goarch }}
          path: coverage.out

      - name: upload static binary (linux-amd64 artifact)
        if: matrix.goarch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: gpstream-linux-amd64
          path: bin/gpstream-linux-amd64

  # Vulnerability scan (TASK-SPEC §9: "govulncheck"). Scans the module's
  # dependency graph against the Go vulnerability database; fails the
  # build on a known-vulnerable dependency.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Smoke: doctor + selftest must run (CR-7 / FR-05).
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: CGO_ENABLED=0 go build -o bin/gpstream ./cmd/gpstream
      - name: selftest
        run: ./bin/gpstream selftest
      - name: doctor (no cluster, healthy baseline)
        run: ./bin/gpstream doctor

  # Heavy/scale tests behind the `heavy` build tag (TASK-SPEC F-09: "heavy/
  # scale tests — by tag and schedule"). Runs on the schedule above (and on
  # manual dispatch) so the default CI pass stays fast; -cover is NOT used
  # here because the full-domain pair-map sweep is already slow under it
  # (231–328 s observed vs ~36 s plain — see pairmap_heavy_test.go).
  heavy:
    if: github.event.schedule != '' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: heavy tests (-tags heavy)
        run: go test -tags heavy -count=1 -timeout 50m ./internal/route/

  # Integration tests on the self-hosted lab runner (TASK-SPEC §9:
  # "integration on a self-hosted runner with test GP6 clusters"). The job
  # is scheduled ONLY for runners labeled `gp6`; until such a runner exists
  # the job stays queued (does not fail the build). Live tests need a real
  # PG 9.4.26 toolchain (GPTEST_PGBIN) — on the testbed vm1 it is
  # /opt/pg9426-vm/bin (see internal/pgtest).
  integration-gp6:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, gp6]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: locate PG 9.4.26 toolchain
        run: |
          for d in /opt/pg9426-vm/bin  /opt/toolchain/pg9426/bin; do
            if [ -x "$d/initdb" ]; then
              echo "GPTEST_PGBIN=$d" >> "$GITHUB_ENV"
              break
            fi
          done
          [ -n "${GPTEST_PGBIN:-}" ] || { echo "no PG 9.4.26 toolchain found (GPTEST_PGBIN)"; exit 1; }
          echo "using $GPTEST_PGBIN"
      - name: integration tests (live PG 9.4.26, -tags integration)
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: go test -tags integration -count=1 -timeout 90m ./...
