name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Heavy tests (TASK-SPEC F-09: "тяжёлые/scale-тесты — по тегам и
  # расписанию"): full-domain pair-map brute force (2^32 sweep) runs here,
  # not in the default pass, so CI's `go test -cover` stays fast and green.
  schedule:
    - cron: '30 3 * * 1' # Mondays 03:30 UTC

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build -o bin/gpstream-$GOARCH ./cmd/gpstream

      - name: test + coverage
        run: |
          go test -cover -coverprofile=coverage.out ./...
          # gate: core packages must be >= 70% (CР-8); reported below
          go tool cover -func=coverage.out | tail -1

      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.goarch }}
          path: coverage.out

  # Smoke: doctor + selftest must run (CР-7 / FR-05).
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: go build -o bin/gpstream ./cmd/gpstream
      - name: selftest
        run: ./bin/gpstream selftest
      - name: doctor (no cluster, healthy baseline)
        run: ./bin/gpstream doctor

  # Heavy/scale tests behind the `heavy` build tag (TASK-SPEC F-09: "тяжёлые/
  # scale-тесты — по тегам и расписанию"). Runs on the schedule above (and on
  # manual dispatch) so the default CI pass stays fast; -cover is NOT used
  # here because the full-domain pair-map sweep is already slow under it
  # (231–328 s observed vs ~36 s plain — see pairmap_heavy_test.go).
  heavy:
    if: github.event.schedule != '' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: heavy tests (-tags heavy)
        run: go test -tags heavy -count=1 -timeout 50m ./internal/route/
