name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build -o bin/gpstream-$GOARCH ./cmd/gpstream

      - name: test + coverage
        run: |
          go test -cover -coverprofile=coverage.out ./...
          # gate: core packages must be >= 70% (CР-8); reported below
          go tool cover -func=coverage.out | tail -1

      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.goarch }}
          path: coverage.out

  # Smoke: doctor + selftest must run (CР-7 / FR-05).
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: go build -o bin/gpstream ./cmd/gpstream
      - name: selftest
        run: ./bin/gpstream selftest
      - name: doctor (no cluster, healthy baseline)
        run: ./bin/gpstream doctor
