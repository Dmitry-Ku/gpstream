# F-05: release pipeline. On every tag v*: build (goreleaser) + publish
# artifacts (tar.gz/deb/rpm, amd64 only) to the GitHub release.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for goreleaser changelog/tag resolution

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # proxy.golang.org intermittently 403s klauspost/compress; the direct
      # (git clone) fallback resolves it (ADR-000).
      - name: Build + publish
        run: |
          export GOPROXY=https://proxy.golang.org,direct
          scripts/package.sh release
        env:
          # goreleaser v1.24 reads GITHUB_TOKEN (NOT GORELEASER_GITHUB_TOKEN)
          # for the GitHub release publisher — verified locally: with the
          # GORELEASER_ prefix it fails `missing GITHUB_TOKEN, ...`.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # scripts/package.sh release honors PUBLISH_FLAG: without
          # --publish=github goreleaser only BUILDS and never creates the
          # GitHub release (the default for this CI step is to publish).
          PUBLISH_FLAG: --publish=github

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gpstream-${{ github.ref_name }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*_checksums.txt
