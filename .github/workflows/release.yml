# F-05: release pipeline. On every tag v*: build (goreleaser) + publish
# artifacts (tar.gz/deb/rpm, amd64 only) to the GitHub release.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for goreleaser changelog/tag resolution

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # goreleaser v1.24 reuses the existing release for the same tag and
      # fails with `422 already_exists` when the old assets are still
      # attached (e.g. after force-moving the tag to a new commit). Delete
      # any pre-existing release for this tag first — idempotent: a 404
      # means there is nothing to delete.
      - name: Delete pre-existing release (idempotent)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          code=$(curl -s -o /tmp/release.json -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}")
          if [ "$code" = "404" ]; then
            echo "no pre-existing release for ${{ github.ref_name }} — nothing to delete"
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::error::failed to look up release (HTTP $code)"; exit 1
          fi
          id=$(python3 -c "import json;print(json.load(open('/tmp/release.json'))['id'])")
          curl -fsSL -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${id}"
          echo "deleted pre-existing release ${id}"

      # proxy.golang.org intermittently 403s klauspost/compress; the direct
      # (git clone) fallback resolves it (ADR-000).
      - name: Build + publish
        run: |
          export GOPROXY=https://proxy.golang.org,direct
          scripts/package.sh release
        env:
          # goreleaser v1.24 auto-publishes to GitHub on `goreleaser release`
          # when GITHUB_TOKEN is set (there is NO --publish flag in v1.24 —
          # passing --publish=github fails `unknown flag: --publish`).
          # Verified locally: with GITHUB_TOKEN the build proceeds straight
          # to POST /releases.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gpstream-${{ github.ref_name }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*_checksums.txt
